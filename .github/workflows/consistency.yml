name: consistency

# Checks that the public materials agree with each other (README vs results/, website data,
# links, report copy, citation metadata). Needs no patient-level data and no model weights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install --quiet pandas numpy "cffconvert>=2.0"
      - name: Run consistency checks
        run: python checks/consistency.py
